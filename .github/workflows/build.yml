name: Build jamovi module

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Cheap, runs on every push/PR: no jamovi install needed for this.
  check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R environment
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Set up Pandoc (for documentation)
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libpng-dev \
            libtiff-dev \
            libjpeg-dev \
            libxml2-dev

      - name: Add jamovi package repository
        run: |
          echo 'options(repos = c(getOption("repos"), jamovi = "https://repo.jamovi.org"))' >> .Rprofile

      # Automatically installs all Linux & R dependencies and caches them!
      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::jmvtools

      - name: Prepare jamovi module bindings
        run: |
          jmvtools::prepare()
        shell: Rscript {0}

      - name: Run R CMD check
        run: |
          rcmdcheck::rcmdcheck(args = c("--no-manual"), error_on = "error")
        shell: Rscript {0}

  # Expensive: only runs when you're actually cutting a release, i.e. a
  # tag push or a manual trigger - never on ordinary pushes or PRs.
  build_jmo:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R environment
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Set up Pandoc (for documentation)
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libpng-dev \
            libtiff-dev \
            libjpeg-dev \
            libxml2-dev \
            flatpak

      - name: Add Flathub remote
        run: |
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install jmvtools and dependencies
        run: |
          options(repos = c(jamovi = 'https://repo.jamovi.org', CRAN = 'https://cran.r-project.org'))
          install.packages(c('remotes', 'jmvtools'))
          remotes::install_deps(dependencies = TRUE)
        shell: Rscript {0}

      # Cached by jamovi version, so unless jamovi itself is updated this
      # only actually downloads once - every later release reuses it.
      - name: Cache Flatpak jamovi install
        id: flatpak-cache-restore
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-jamovi-${{ runner.os }}-v1

      - name: Install jamovi and Freedesktop SDK (Flatpak)
        if: steps.flatpak-cache-restore.outputs.cache-hit != 'true'
        run: |
          flatpak install --user -y flathub org.jamovi.jamovi
          flatpak install --user -y flathub org.freedesktop.Sdk//25.08 || flatpak install --user -y flathub org.freedesktop.Sdk

      - name: Build .jmo
        run: |
          Rscript -e '
            tryCatch(
              jmvtools::install(home = "flatpak"),
              error = function(e) {
                # jmvtools::install() both builds the .jmo and then tries to
                # install it into a running jamovi instance. The
                # install-into-jamovi half cannot work headlessly - Electron
                # has no display/D-Bus session to launch against - but the
                # .jmo file we actually want is already written to disk by
                # this point, so this is non-fatal. The next step verifies
                # the file genuinely exists.
                message("Ignoring post-build install error: ", conditionMessage(e))
              }
            )
          '

      - name: Locate built module
        id: locate
        run: |
          JMO_PATH=$(find . -maxdepth 2 -name "*.jmo" | head -n 1)
          if [ -z "$JMO_PATH" ]; then
            echo "Error: No .jmo file found after build."
            exit 1
          fi
          echo "jmo_path=${JMO_PATH}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: jamovi-module
          path: ${{ steps.locate.outputs.jmo_path }}

  create_release:
    name: Create GitHub Release
    needs: build_jmo
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version alignment
        run: |
          DESC_VERSION=$(grep "^Version:" DESCRIPTION | sed 's/Version: *//' | tr -d '[:space:]')
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [[ "$TAG_VERSION" != "$DESC_VERSION"* ]]; then
            echo "Error: Tag $TAG_VERSION does not match DESCRIPTION Version $DESC_VERSION"
            exit 1
          fi

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: jamovi-module
          path: dist

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.jmo
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') }}
          generate_release_notes: true
