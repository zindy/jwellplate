title: Well Plate Map
name: wellPlate
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    name: variableSupplier
    persistentItems: false
    stretchFactor: 1
    permitted:
      - factor
      - id
      - numeric
    children:
      - type: TargetLayoutBox
        label: Well ID (use instead of Row + Column)
        children:
          - type: VariablesListBox
            name: wellID
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Row (use instead of Well ID)
        children:
          - type: VariablesListBox
            name: rowVar
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Column (use instead of Well ID)
        children:
          - type: VariablesListBox
            name: colVar
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Value
        children:
          - type: VariablesListBox
            name: value
            maxItemCount: 1
            isTarget: true
  - type: CollapseBox
    label: Plate options
    collapsed: false
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: ComboBox
            name: plateSize
          - type: ComboBox
            name: shape
          - type: ComboBox
            name: colourScheme
          - type: CheckBox
            name: showLegend
          - type: CheckBox
            name: crossMissing
          - type: CheckBox
            name: showBorder
          - type: TextBox
            name: wellSize
            format: number
            suffix: none
